name: Update Website

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true

      - name: Run Strava fetch
        run: |
          python strava_data_fetch/fetch_data.py

      - name: Build site (only if your project truly needs it)
        run: npm run build || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "chore: update Strava data" || echo "No changes"

          git push

      - name: Trigger rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          echo "rebuild $(date)" > .github/rebuild.txt
      
          git add .github/rebuild.txt
          git commit -m "chore: trigger rebuild" || echo "No changes"
          git push
